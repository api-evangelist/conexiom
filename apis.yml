name: Conexiom
description: >-
  Conexiom is an AI-powered sales order and invoice automation platform for
  manufacturers and distributors. It captures order and document data from any
  format (PDFs, Excel, email bodies, scans, and handwritten notes), validates
  and corrects it against ERP systems, and pushes clean, touchless transactions
  into a customer's order-management workflow. The platform surfaces its own
  document API (retrieving document lists and attachments) and a set of ERP
  integrations, documented in an authenticated help center rather than a public
  developer portal. Conexiom is backed by ICONIQ Capital and runs on Microsoft
  Azure with a SOC 2 Type II and GDPR-aligned security posture.
